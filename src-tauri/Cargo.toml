[package]
name = "gitfling"
version = "0.1.0"
description = "GitFling - git-ftp compatible GUI (Tauri + Rust)"
authors = ["kanda"]
edition = "2021"

[lib]
name = "gitfling_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
git2 = "0.19"
ignore = "0.4"
suppaftp = { version = "6", features = ["native-tls"] }
ssh2 = "0.9"
uuid = { version = "1", features = ["v4"] }
dirs = "5"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
